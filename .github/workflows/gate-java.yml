name: Gate - Java (Maven / Gradle)

on:
  workflow_call:
    inputs:
      java-version:
        description: JDK version
        required: false
        type: string
        default: '17'
      java-distribution:
        description: JDK distribution
        required: false
        type: string
        default: 'temurin'
      build-tool:
        description: 'maven / gradle'
        required: false
        type: string
        default: 'maven'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: ${{ inputs.build-tool }}
      - name: Lint (Maven)
        if: inputs.build-tool == 'maven'
        run: mvn -B -ntp checkstyle:check spotless:check
      - name: Lint (Gradle)
        if: inputs.build-tool == 'gradle'
        run: ./gradlew --no-daemon checkstyleMain spotlessCheck

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: ${{ inputs.build-tool }}
      - name: Test (Maven)
        if: inputs.build-tool == 'maven'
        run: mvn -B -ntp test
      - name: Test (Gradle)
        if: inputs.build-tool == 'gradle'
        run: ./gradlew --no-daemon test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: ${{ inputs.build-tool }}
      - name: Package (Maven)
        if: inputs.build-tool == 'maven'
        run: mvn -B -ntp package -DskipTests
      - name: Build (Gradle)
        if: inputs.build-tool == 'gradle'
        run: ./gradlew --no-daemon build -x test
